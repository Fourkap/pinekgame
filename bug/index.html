<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PINEK — Signaler un bug · Proposer une amélioration</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../assets/favicon.png" />
  <style>
    :root {
      --green-0:#1f5d44; --green-1:#184635; --green-2:#102b21; --green-3:#0b1f18;

      --cream:#f4eddb; --cream-dim:#cdc6b3;
      --line: rgba(214,180,110,.3); --card: rgba(8,20,14,.38);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           color: var(--cream); line-height: 1.55; min-height: 100vh;
           background: radial-gradient(120% 90% at 50% -10%, var(--green-0) 0%, var(--green-1) 38%, var(--green-2) 72%, var(--green-3) 100%) fixed; }
    a { color: var(--gold-soft); text-decoration: none; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }

    .langbar { position: fixed; top: 14px; right: 16px; z-index: 50;
      background: rgba(11,31,24,.6); backdrop-filter: blur(8px); border: 1px solid rgba(214,180,110,.35);
      border-radius: 999px; padding: 6px 6px 6px 14px; display: flex; align-items: center; gap: 7px; }
    .langbar .globe { color: var(--gold-soft); font-size: .95rem; }
    .langbar select { font: inherit; font-size: .85rem; font-weight: 600; color: var(--cream);
      background: transparent; border: none; border-radius: 999px; padding: 3px 4px; cursor: pointer; outline: none; }
    .langbar select option { color: #10261c; }
    html[dir="rtl"] .langbar { right: auto; left: 16px; }

    header { display: flex; align-items: center; gap: 14px; margin: 44px 0 18px; }
    header img { width: 58px; height: 58px; border-radius: 15px; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
    h1 { font-size: 1.55rem; margin: 0; }
    .note { font-size: .9rem; color: var(--cream-dim); margin: 2px 0 0; }

    .seg { display: flex; gap: 8px; }
    .seg button { flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--cream);
                  border-radius: 12px; padding: 11px 8px; font: inherit; font-size: .98rem; cursor: pointer; }
    .seg button.on { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 700; }
    .seg.type { margin: 6px 0 14px; }
    .seg.type button { padding: 13px 8px; font-weight: 600; }

    .intro { color: var(--cream-dim); margin: 0 0 6px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
            padding: 16px 18px; margin: 14px 0; }
    label.h { display: block; font-weight: 700; font-size: .78rem; letter-spacing: .1em;
              text-transform: uppercase; color: rgba(214,180,110,.9); margin-bottom: 10px; }
    select.field, input.field, textarea.field { width: 100%; font: inherit; color: var(--cream);
      background: rgba(8,20,14,.45); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; margin-top: 10px; }
    select.field option { color: #10261c; }
    textarea.field { min-height: 150px; resize: vertical; margin-top: 0; }
    input.field::placeholder, textarea.field::placeholder { color: rgba(244,237,219,.4); }
    .hint { font-size: .85rem; color: var(--cream-dim); margin: 8px 0 0; }

    .shots { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
    .shot { position: relative; width: 84px; height: 84px; }
    .shot img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
    .shot button { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 12px;
                   border: none; background: var(--gold); color: var(--gold-ink); font-weight: 700; cursor: pointer; line-height: 1; }
    html[dir="rtl"] .shot button { right: auto; left: -8px; }
    .add { width: 84px; height: 84px; border: 1px dashed var(--line); border-radius: 10px; display: flex;
           flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: var(--gold-soft);
           font-size: .72rem; text-align: center; padding: 4px; background: transparent; font-family: inherit; }
    .add b { font-size: 1.6rem; line-height: 1; margin-bottom: 2px; }

    .btn { display: block; width: 100%; border: none; border-radius: 14px; padding: 15px;
           font: inherit; font-size: 1.08rem; font-weight: 700; background: var(--gold); color: var(--gold-ink);
           cursor: pointer; margin-top: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn:active { opacity: .75; }
    .ok { background: rgba(214,180,110,.14); border: 1px solid var(--gold); border-radius: 14px; padding: 14px 18px; margin: 14px 0; }
    .ok b { color: var(--gold-soft); }
    .hide { display: none !important; }
    .honey { position: absolute; left: -9999px; }
    footer { margin-top: 36px; font-size: .85rem; color: var(--cream-dim); text-align: center; }
    footer a { margin: 0 6px; font-weight: 600; }
  </style>
</head>
<body>

<nav class="langbar" aria-label="Language">
  <span class="globe" aria-hidden="true">🌐</span>
  <select id="langSelect" onchange="setLang(this.value)" aria-label="Language">
    <option value="fr">Français</option>
    <option value="en">English</option>
    <option value="hy">Հայերեն</option>
    <option value="es">Español</option>
    <option value="de">Deutsch</option>
    <option value="ar">العربية</option>
    <option value="tr">Türkçe</option>
    <option value="zh">中文</option>
    <option value="ru">Русский</option>
    <option value="pt">Português</option>
    <option value="ko">한국어</option>
    <option value="ja">日本語</option>
  </select>
</nav>

<div class="wrap">
<header>
  <img src="../assets/icon.png" alt="PINEK" />
  <div>
    <h1 id="title"></h1>
    <p class="note" data-i="sub"></p>
  </div>
</header>

<div class="ok hide" id="sent"><b data-i="thanksTitle"></b><br /><span id="thanksMsg"></span></div>

<div class="seg type">
  <button type="button" id="t-bug" onclick="setType('bug')" data-i="tabBug"></button>
  <button type="button" id="t-idea" onclick="setType('idea')" data-i="tabIdea"></button>
</div>

<p class="intro" id="intro"></p>

<form id="f" method="POST" enctype="multipart/form-data" onsubmit="return onSubmit(event)">
  <input type="hidden" name="_subject" id="subject" />
  <input type="hidden" name="_template" value="table" />
  <input type="hidden" name="_captcha" value="false" />
  <input type="hidden" name="_next" id="next" />
  <input type="hidden" name="type" id="typeField" value="bug" />
  <input type="hidden" name="platform" id="platformField" value="ios" />
  <input type="hidden" name="navigateur" id="uaField" />
  <input type="hidden" name="langue" id="langField" />
  <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" />

  <div class="card" id="deviceCard">
    <label class="h" data-i="device"></label>
    <div class="seg">
      <button type="button" id="p-ios" onclick="setPlatform('ios')">iPhone / iPad</button>
      <button type="button" id="p-android" onclick="setPlatform('android')">Android</button>
    </div>
    <select class="field" id="iosModel" name="appareil"></select>
    <input class="field hide" id="androidModel" name="appareil_android" />
    <p class="hint" id="deviceHint"></p>
  </div>

  <div class="card">
    <label class="h" id="describeLabel"></label>
    <textarea class="field" id="desc" name="message" required></textarea>
    <p class="hint" id="describeHint"></p>
  </div>

  <div class="card" id="shotsCard">
    <label class="h" data-i="shots"></label>
    <div class="shots" id="shots">
      <button type="button" class="add" id="addBtn" onclick="document.getElementById('files').click()"><b>+</b><span data-i="addShots"></span></button>
    </div>
    <input type="file" id="files" name="capture" accept="image/*" multiple class="hide" onchange="onFiles(this.files)" />
    <p class="hint" data-i="shotsHint"></p>
  </div>

  <div class="card">
    <label class="h" data-i="email"></label>
    <input class="field" type="email" id="replyto" name="_replyto" style="margin-top:0" autocomplete="email" required />
    <p class="hint" data-i="emailHint"></p>
  </div>

  <button class="btn" type="submit" id="sendBtn" data-i="send"></button>
</form>

<footer>
  <span data-i="inapp"></span><br />
  <a href="../">PINEK</a> · <a href="../support/" data-i="support"></a>
</footer>
</div>

  let lang = 'fr', platform = 'ios', type = 'bug', files = [];

  function d() { return T[lang] || T.en; }

  function fill() {
    const t = d(), idea = type === 'idea';
    document.documentElement.lang = lang;
    document.documentElement.dir = RTL[lang] ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t[el.dataset.i]; });
    document.getElementById('title').textContent = idea ? t.titleIdea : t.title;
    document.title = 'PINEK — ' + (idea ? t.titleIdea : t.title);
    document.getElementById('intro').textContent = idea ? t.introIdea : t.intro;
    document.getElementById('describeLabel').textContent = idea ? t.describeIdea : t.describe;
    document.getElementById('describeHint').textContent = idea ? t.describeHintIdea : t.describeHint;
    document.getElementById('desc').placeholder = idea ? t.descPhIdea : t.descPh;
    document.getElementById('thanksMsg').textContent = idea ? t.thanksIdea : t.thanks;
    document.getElementById('t-bug').classList.toggle('on', !idea);
    document.getElementById('t-idea').classList.toggle('on', idea);
    document.getElementById('deviceCard').classList.toggle('hide', idea);
    document.getElementById('shotsCard').classList.toggle('hide', idea);
    const sel = document.getElementById('iosModel'), keep = sel.value;
    sel.innerHTML = '';
    MODELS.concat([t.other]).forEach(m => { const o = document.createElement('option'); o.value = o.textContent = m; sel.appendChild(o); });
    if (keep && [...sel.options].some(o => o.value === keep)) sel.value = keep;
    document.getElementById('androidModel').placeholder = t.androidPh;
    document.getElementById('deviceHint').textContent = platform === 'ios' ? t.chooseModel : t.androidHint;
    document.getElementById('langSelect').value = lang;
    document.getElementById('langField').value = lang;
    document.getElementById('typeField').value = type;
    document.getElementById('platformField').value = platform;
  }
  function setLang(l) { lang = T[l] ? l : 'en'; try { localStorage.setItem('pinek_lang', lang); } catch (e) {} fill(); }
  function setType(t) {
    type = t;
    try { history.replaceState(null, '', t === 'idea' ? '?type=idea' : location.pathname); } catch (e) {}
    fill();
  }
  function setPlatform(p) {
    platform = p;
    document.getElementById('p-ios').classList.toggle('on', p === 'ios');
    document.getElementById('p-android').classList.toggle('on', p === 'android');
    document.getElementById('iosModel').classList.toggle('hide', p !== 'ios');
    document.getElementById('androidModel').classList.toggle('hide', p !== 'android');
    fill();
  }

  // Images : on garde notre propre liste (aperçus + suppression), puis on la réinjecte
  // dans l'input file via DataTransfer au moment de l'envoi.
  function onFiles(list) {
    const t = d();
    const next = files.concat([...list]);
    if (next.length > MAX_FILES) { alert(t.tooMany); }
    files = next.slice(0, MAX_FILES);
    if (files.reduce((s, f) => s + f.size, 0) > MAX_BYTES) { alert(t.tooBig); files = files.slice(0, -1); }
    renderShots();
  }
  function removeShot(i) { files.splice(i, 1); renderShots(); }
  function renderShots() {
    const box = document.getElementById('shots'), add = document.getElementById('addBtn');
    box.querySelectorAll('.shot').forEach(el => el.remove());
    files.forEach((f, i) => {
      const w = document.createElement('div'); w.className = 'shot';
      const img = document.createElement('img'); img.src = URL.createObjectURL(f); img.alt = f.name;
      const b = document.createElement('button'); b.type = 'button'; b.textContent = '×'; b.onclick = () => removeShot(i);
      w.appendChild(img); w.appendChild(b); box.insertBefore(w, add);
    });
    add.classList.toggle('hide', files.length >= MAX_FILES);
    const dt = new DataTransfer(); files.forEach(f => dt.items.add(f));
    document.getElementById('files').files = dt.files;
  }

  function onSubmit(e) {
    const t = d(), f = document.getElementById('f');
    const desc = document.getElementById('desc').value.trim();
    if (desc.length < 5) { e.preventDefault(); alert(t.needDesc); document.getElementById('desc').focus(); return false; }
    const model = type === 'idea' ? '' : platform === 'ios'
      ? document.getElementById('iosModel').value
      : (document.getElementById('androidModel').value.trim() || 'Android');
    document.getElementById('subject').value = type === 'idea' ? 'Pinek – suggestion' : 'Pinek – bug — ' + model;
    document.getElementById('uaField').value = navigator.userAgent;
    // Champs non pertinents retirés de l'envoi (évite les colonnes vides dans le mail).
    document.getElementById(platform === 'ios' ? 'androidModel' : 'iosModel').disabled = true;
    if (type === 'idea') { document.getElementById('iosModel').disabled = true; document.getElementById('androidModel').disabled = true; document.getElementById('files').disabled = true; }
    const mail = document.getElementById('replyto');
    if (!mail.value.trim() || !mail.checkValidity()) { e.preventDefault(); alert(t.needEmail); mail.focus(); return false; }
    const u = new URL(location.href); u.search = ''; u.searchParams.set('sent', '1'); u.searchParams.set('type', type); u.searchParams.set('lang', lang);
    document.getElementById('next').value = u.toString();
    f.action = ENDPOINT;
    const btn = document.getElementById('sendBtn'); btn.disabled = true; btn.textContent = t.sending;
    return true;
  }

  (function init() {
    const q = new URLSearchParams(location.search);
    let saved = null; try { saved = localStorage.getItem('pinek_lang'); } catch (e) {}
    const nav = (navigator.language || 'fr').slice(0, 2);
    lang = T[q.get('lang')] ? q.get('lang') : (saved || (T[nav] ? nav : 'en'));
    type = q.get('type') === 'idea' ? 'idea' : 'bug';
    setPlatform(/android/i.test(navigator.userAgent) ? 'android' : 'ios');
    if (q.get('sent') === '1') {
      document.getElementById('sent').classList.remove('hide');
      try { history.replaceState(null, '', type === 'idea' ? '?type=idea' : location.pathname); } catch (e) {}
    }
  })();
</script>
